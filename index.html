<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engine6.0 Loading</title>
<style>
body, html {
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    font-family:'Arial',sans-serif;
    overflow:hidden;
    background:#111;
    color:#fff;
}

/* Snow canvas behind everything */
#snowCanvas {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    filter: blur(2px);
}

/* Loading screen container */
#loadingScreen {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.85);
    z-index:1000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    backdrop-filter: blur(10px);
    transition: opacity 0.8s ease;
}

/* Logo animation */
#loadingLogo {
    font-size:3rem;
    font-weight:bold;
    color:#00d4ff;
    text-shadow: 0 0 15px #00f0ff, 0 0 30px #00aaff;
    margin-bottom:30px;
    animation: rotateLogo 3s linear infinite;
}
@keyframes rotateLogo {
    0% { transform: rotateY(0deg) rotateX(0deg); }
    50% { transform: rotateY(180deg) rotateX(180deg); }
    100% { transform: rotateY(360deg) rotateX(360deg); }
}

/* Progress bar container */
.progress-container {
    width:70%;
    max-width:600px;
    height:25px;
    border-radius:15px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.25);
    box-shadow: inset 0 1px 5px rgba(255,255,255,0.1);
    margin-bottom:20px;
}

/* Progress bar fill (white now) */
.progress-bar {
    width:0%;
    height:100%;
    background: #ffffff;
    border-radius:15px;
    transition: width 0.2s ease;
}

/* Percentage text */
#progressText {
    font-size:1.2rem;
    margin-bottom:10px;
    color:#fff;
    text-shadow: 0 0 10px #00d4ff;
}

/* Loading message text */
#loadingMessage {
    font-size:1rem;
    color:#cceeff;
    text-shadow: 0 0 6px #00aaff;
}

/* Hide loading screen */
#loadingScreen.hidden {
    opacity:0;
    pointer-events:none;
}
</style>
</head>
<body>

<canvas id="snowCanvas"></canvas>

<div id="loadingScreen">
    <div id="loadingLogo">ENGINE6.0</div>
    <div id="progressText">0%</div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="loadingMessage">Initializing systems...</div>
</div>

<script>
// Snow background
const canvas = document.getElementById('snowCanvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

const snowflakes = [];
const numFlakes = 200;

function random(min,max){return Math.random()*(max-min)+min;}

class Snowflake {
  constructor(){
    this.x=random(0,width);
    this.y=random(0,height);
    this.radius=random(1,3);
    this.speed=random(1,3);
    this.wind=random(-1,1);
  }
  update(){
    this.y+=this.speed;
    this.x+=this.wind;
    if(this.y>height){ this.y=-this.radius; this.x=random(0,width);}
    if(this.x>width) this.x=0;
    if(this.x<0) this.x=width;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fillStyle='white';
    ctx.fill();
  }
}

function initSnow(){ for(let i=0;i<numFlakes;i++) snowflakes.push(new Snowflake()); }
function animateSnow(){ ctx.clearRect(0,0,width,height); snowflakes.forEach(f=>{f.update(); f.draw();}); requestAnimationFrame(animateSnow); }
window.addEventListener('resize',()=>{ width=canvas.width=window.innerWidth; height=canvas.height=window.innerHeight; });
initSnow(); animateSnow();

// Loading progress animation
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const loadingMessage = document.getElementById('loadingMessage');
const loadingScreen = document.getElementById('loadingScreen');

let progress = 0;
const messages = [
    "Initializing systems...",
    "Loading modules...",
    "Decrypting secure files...",
    "Applying glass effects...",
    "Finalizing setup..."
];

function updateLoading(){
    progress += Math.random()*3; // random increment
    if(progress > 100) progress = 100;
    progressBar.style.width = progress + '%';
    progressText.textContent = Math.floor(progress) + '%';
    loadingMessage.textContent = messages[Math.floor(progress/20)] || messages[messages.length-1];
    if(progress < 100){
        requestAnimationFrame(updateLoading);
    } else {
        // Redirect to untitled-1.html after loading completes
        setTimeout(()=>{ window.location.href = "untitled-1.html"; }, 800);
    }
}

updateLoading();
</script>

</body>
</html>
