<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engine6.0 Vault</title>
<style>
body, html { margin:0; padding:0; overflow-x:hidden; font-family:Arial,sans-serif; background:#111; color:#fff; min-height:100vh; }

/* Snow canvas */
canvas {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
  filter: blur(2px);
}

/* Buttons with glass effect */
.upload-btn {
  position:fixed;
  top:20px;
  right:20px;
  z-index:2;
  padding:12px 22px;
  border-radius:12px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  color:#fff;
  font-size:14px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.2);
  box-shadow: inset 0 0 5px rgba(255,255,255,0.1);
  transition: all 0.3s ease;
}
.upload-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

/* Info panels container */
.info-container {
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  gap:30px;
  margin:40px auto 40px auto;
  flex-wrap:wrap;
}

/* Individual info panel glass effect */
.info-panel {
  width:220px;
  min-height:120px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  border-radius:18px;
  padding:20px;
  border:1px solid rgba(255,255,255,0.2);
  box-shadow: inset 0 1px 5px rgba(255,255,255,0.1);
  text-align:center;
  transition: all 0.3s ease;
}
.info-panel:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
.info-panel h3 { margin:0 0 10px 0; font-size:16px; color:#fff; }
.info-panel p { font-size:12px; line-height:1.4; color:#ddd; }

/* File carousel */
.file-carousel {
  position:relative;
  z-index:2;
  display:flex;
  gap:25px;
  padding:20px 40px 40px 40px;
  overflow-x:auto;
  scroll-behavior:smooth;
  height:240px;
  margin-bottom:40px;
}

/* File cards with glass effect */
.file-card {
  flex:0 0 140px;
  height:190px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  border-radius:15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:14px;
  text-align:center;
  cursor:pointer;
  color:#fff;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow: inset 0 1px 5px rgba(255,255,255,0.1);
  transition: all 0.3s ease;
}
.file-card:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
.file-icon { font-size:48px; margin-bottom:8px; }
.file-name { font-size:12px; word-break: break-word; padding:0 5px; color:#fff; }
.file-owner { font-size:10px; color:#ddd; margin-top:3px; }

/* Modal common glass style */
.modal-bg { position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:20; }
.modal {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  padding:25px 35px;
  border-radius:15px;
  color:#fff;
  display:flex;
  flex-direction:column;
  gap:15px;
  min-width:300px;
  border:1px solid rgba(255,255,255,0.2);
  box-shadow: inset 0 1px 5px rgba(255,255,255,0.1);
}
.modal input {
  padding:8px 10px;
  border-radius:8px;
  border:none;
  outline:none;
  font-size:14px;
  background: rgba(255,255,255,0.1);
  color:#fff;
}
.modal button {
  padding:10px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background: rgba(255,255,255,0.1);
  color:#fff;
  font-weight:bold;
  transition: all 0.3s ease;
}
.modal button:hover { background: rgba(255,255,255,0.2); }

/* Password Modal specific */
#passwordModal input { margin-bottom:10px; }
</style>
</head>
<body>

<label class="upload-btn" id="addFileBtn">Add File</label>

<!-- Info Panels -->
<div class="info-container">
  <div class="info-panel">
    <h3>Performance</h3>
    <p>Engine6.0 runs at optimized 3.2GHz multi-threaded cycles for ultra-fast processing.</p>
  </div>
  <div class="info-panel">
    <h3>Security</h3>
    <p>Built-in AES-256 encryption ensures all data remains fully secure.</p>
  </div>
  <div class="info-panel">
    <h3>We use Gofile to store all of our files</h3>
    <p>Tutorial in Discord</p>
  </div>
</div>

<!-- File carousel -->
<div class="file-carousel" id="carousel"></div>

<!-- Add File Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <h3>File Information</h3>
    <input type="text" id="fileNameInput" placeholder="File Name">
    <input type="text" id="ownerInput" placeholder="Owner Name">
    <input type="password" id="passwordInput" placeholder="Password (optional)">
    <input type="text" id="fileLinkInput" placeholder="Gofile Link">
    <button id="saveFileBtn">Save File</button>
  </div>
</div>

<!-- Password Modal -->
<div class="modal-bg" id="passwordModalBg">
  <div class="modal" id="passwordModal">
    <h3>Enter Password</h3>
    <input type="password" id="checkPasswordInput" placeholder="Password">
    <button id="submitPasswordBtn">Submit</button>
    <button id="cancelPasswordBtn">Cancel</button>
  </div>
</div>

<!-- Snow Canvas -->
<canvas id="snow"></canvas>

<script>
// Elements
const carousel = document.getElementById('carousel');
const modalBg = document.getElementById('modalBg');
const passwordModalBg = document.getElementById('passwordModalBg');
const fileNameInput = document.getElementById('fileNameInput');
const ownerInput = document.getElementById('ownerInput');
const passwordInput = document.getElementById('passwordInput');
const fileLinkInput = document.getElementById('fileLinkInput');
const saveFileBtn = document.getElementById('saveFileBtn');
const addFileBtn = document.getElementById('addFileBtn');
const submitPasswordBtn = document.getElementById('submitPasswordBtn');
const cancelPasswordBtn = document.getElementById('cancelPasswordBtn');
const checkPasswordInput = document.getElementById('checkPasswordInput');

let files = JSON.parse(localStorage.getItem('vaultFiles') || '[]');
let selectedFile = null;

function renderCarousel(){
  carousel.innerHTML='';
  files.forEach(meta=>{
    const card=document.createElement('div'); card.className='file-card';
    const icon=document.createElement('div'); icon.className='file-icon'; icon.textContent='📁';
    const nameEl=document.createElement('div'); nameEl.className='file-name'; nameEl.textContent=meta.name;
    const ownerEl=document.createElement('div'); ownerEl.className='file-owner'; ownerEl.textContent=`Owner: ${meta.owner}`;
    card.appendChild(icon); card.appendChild(nameEl); card.appendChild(ownerEl);

    card.addEventListener('click', ()=>{
      if(meta.password){ selectedFile=meta; checkPasswordInput.value=''; passwordModalBg.style.display='flex'; }
      else{ window.open(meta.link,'_blank'); }
    });

    carousel.appendChild(card);
  });
}

addFileBtn.addEventListener('click', ()=>{ modalBg.style.display='flex'; });
saveFileBtn.addEventListener('click', ()=>{
  const name=fileNameInput.value.trim();
  const owner=ownerInput.value.trim()||'Owner';
  const password=passwordInput.value.trim();
  const link=fileLinkInput.value.trim();
  if(!name||!link){ alert('Provide file name and Gofile link.'); return; }
  files.push({ name, owner, password, link });
  localStorage.setItem('vaultFiles', JSON.stringify(files));
  renderCarousel();
  modalBg.style.display='none';
  fileNameInput.value=''; ownerInput.value=''; passwordInput.value=''; fileLinkInput.value='';
});

submitPasswordBtn.addEventListener('click', ()=>{
  if(selectedFile && checkPasswordInput.value === selectedFile.password){
    window.open(selectedFile.link,'_blank');
    passwordModalBg.style.display='none';
  } else { alert("Incorrect password!"); }
});
cancelPasswordBtn.addEventListener('click', ()=>{ passwordModalBg.style.display='none'; });

renderCarousel();

// Page security
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", function(e) {
    if (e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key)) ||
        (e.ctrlKey && ["U","S"].includes(e.key))
    ) e.preventDefault();
});
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("cut", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
history.pushState(null, null, location.href);
window.onpopstate = function () { history.go(1); };

// Advanced snow effect
const canvas = document.getElementById('snow');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

const snowflakes = [];
const numFlakes = 200;

function random(min,max){return Math.random()*(max-min)+min;}

class Snowflake {
  constructor(){
    this.x=random(0,width);
    this.y=random(0,height);
    this.radius=random(1,3);
    this.speed=random(1,3);
    this.wind=random(-1,1);
  }
  update(){
    this.y+=this.speed;
    this.x+=this.wind;
    if(this.y>height){ this.y=-this.radius; this.x=random(0,width);}
    if(this.x>width) this.x=0;
    if(this.x<0) this.x=width;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fillStyle='white';
    ctx.fill();
  }
}

function initSnow(){ for(let i=0;i<numFlakes;i++) snowflakes.push(new Snowflake()); }
function animate(){ ctx.clearRect(0,0,width,height); snowflakes.forEach(f=>{f.update();f.draw();}); requestAnimationFrame(animate); }

window.addEventListener('resize',()=>{ width=canvas.width=window.innerWidth; height=canvas.height=window.innerHeight; });

initSnow(); animate();
</script>

</body>
</html>
